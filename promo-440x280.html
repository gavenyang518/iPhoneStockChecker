<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Promo Tile 440x280</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
      body {
        width: 440px;
        height: 280px;
        background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0f172a 100%);
        overflow: hidden;
        color: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        position: relative;
      }
      .icon-box {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        background: #1e293b;
        box-shadow: 0 10px 25px -5px rgba(0, 113, 227, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 12px;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      .icon-box img {
        width: 48px;
        height: 48px;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 6px;
      }
      p {
        font-size: 13px;
        color: #94a3b8;
        line-height: 1.4;
        margin-bottom: 14px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(34, 197, 94, 0.15);
        border: 1px solid #22c55e;
        color: #4ade80;
        font-size: 11px;
        font-weight: 600;
        padding: 4px 12px;
        border-radius: 999px;
      }
      .dot {
        width: 6px;
        height: 6px;
        background: #22c55e;
        border-radius: 50%;
        box-shadow: 0 0 6px #22c55e;
      }
    </style>
  </head>
  <body>
    <div class="icon-box">
      <img src="icons/icon-128.png" alt="" />
    </div>
    <h1>RestockCheck</h1>
    <p>Live Apple Store Pickup Stock Alerts</p>
    <div class="badge">
      <div class="dot"></div>
      <span>Every 30s · 25 Countries · Stock checks run in your browser</span>
    </div>
  </body>
</html>
